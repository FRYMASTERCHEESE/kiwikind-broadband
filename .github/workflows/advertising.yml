name: Advertising affected checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py test portal.test_advertising --settings=config.test_settings
        env:
          DEBUG: '1'
          SECRET_KEY: advertising-fixture-only-012345678901234567890123456789012345
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and lint optional official test ads only
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug -PKIWIKIND_TEST_ADS=true -PKIWIKIND_API_ORIGIN=
      - uses: actions/upload-artifact@v4
        with:
          name: KiwiKind-internal-test-ads-never-Play
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
