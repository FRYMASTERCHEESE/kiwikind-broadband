name: Apply isolated Stripe integration source
on:
  push:
    branches: [integration/stripe-current-stack]
    paths:
      - scripts/integration-edits.json
      - scripts/integration-expected.json
      - scripts/apply-reviewed-integration.py
      - .github/workflows/apply-reviewed-integration.yml
permissions:
  contents: write
jobs:
  apply-tested-source:
    if: github.repository == 'FRYMASTERCHEESE/kiwikind-broadband' && github.ref == 'refs/heads/integration/stripe-current-stack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRET_KEY: synthetic-ci-only-key-012345678901234567890123456789012345
      DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only checksum-pinned source edits to this isolated branch
        run: python scripts/apply-reviewed-integration.py
      - run: pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --settings=config.test_settings
      - run: node --test site/tests/*.test.cjs
      - name: Commit verified source only; never deploy or enable payments
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/integration/stripe-current-stack'
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          names=list(json.loads(Path('scripts/integration-edits.json').read_text()))
          subprocess.run(['git','add','--',*names],check=True)
          PY
          git rm scripts/integration-edits.json scripts/integration-expected.json scripts/apply-reviewed-integration.py
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply checksum-verified current-stack billing integration after regression tests'
          git push origin HEAD:refs/heads/integration/stripe-current-stack
          git rev-parse HEAD
