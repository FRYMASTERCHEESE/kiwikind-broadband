name: Native Android visual review
on:
  workflow_dispatch:
  push:
    branches: [fix/native-website-style]
    paths: ['android/**', '.github/workflows/android-visual-review.yml']
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and lint affected native UI
        working-directory: android
        run: gradle --no-daemon lintDebug assembleDebug assembleDebugAndroidTest -PKIWIKIND_API_ORIGIN=
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p visual-evidence
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w nz.kiwikind.broadband.test/nz.kiwikind.broadband.VisualCapture | tee visual-evidence/instrumentation.txt
            adb pull /sdcard/Android/data/nz.kiwikind.broadband/files/visual-evidence visual-evidence/phone
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell settings put system font_scale 1.3
            adb shell am force-stop nz.kiwikind.broadband
            adb shell am instrument -w nz.kiwikind.broadband.test/nz.kiwikind.broadband.VisualCapture | tee visual-evidence/large-font-instrumentation.txt
            adb pull /sdcard/Android/data/nz.kiwikind.broadband/files/visual-evidence visual-evidence/narrow-large-font
            adb logcat -d -s AndroidRuntime:E > visual-evidence/crashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-visual-review
          path: |
            visual-evidence/
            android/app/build/reports/lint-results-debug.html
