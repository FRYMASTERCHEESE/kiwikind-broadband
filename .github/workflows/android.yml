name: Android pre-launch build
on:
  workflow_dispatch:
    inputs:
      test_ads:
        description: Compile and lint only the internal official test-ad preview
        required: false
        type: boolean
        default: false
      api_origin:
        description: Dedicated KiwiKind HTTPS backend origin (blank builds disconnected pre-launch shell)
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile, lint and unit test debug review build
        working-directory: android
        env:
          API_ORIGIN: ${{ inputs.api_origin }}
          TEST_ADS: ${{ inputs.test_ads }}
        run: |
          if [ "$TEST_ADS" = "true" ]; then
            gradle --no-daemon lintDebug assembleDebug -PKIWIKIND_TEST_ADS=true "-PKIWIKIND_API_ORIGIN=$API_ORIGIN"
          else
            gradle --no-daemon testDebugUnitTest lintDebug assembleDebug "-PKIWIKIND_API_ORIGIN=$API_ORIGIN"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kiwikind-prelaunch-debug-review
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
          retention-days: 7
