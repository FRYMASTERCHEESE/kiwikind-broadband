name: Publish KiwiKind pre-launch website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/dist/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static pre-launch website
        run: |
          mkdir -p _site
          cp site/dist/index.html site/dist/app.js site/dist/styles.css _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
