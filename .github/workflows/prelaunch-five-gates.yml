name: Five focused prelaunch gates
on:
  push:
    branches: [audit/prelaunch-email-restore-20261017]
    paths:
      - scripts/prelaunch_six_gates.py
      - .github/workflows/prelaunch-five-gates.yml
  workflow_dispatch:
    inputs:
      extended:
        description: Run only additional disposable-database verification
        type: boolean
        default: false
      source_ref:
        description: Source revision to verify with additional tests
        type: string
        default: feature/neon-postgres-config
      test_labels:
        description: Additional test classes to run
        type: string
        default: portal.test_extended_verification
permissions:
  contents: read
jobs:
  focused-prelaunch:
    if: ${{ !inputs.extended }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check five outstanding security gates without re-running passed suites
        run: python3 scripts/prelaunch_six_gates.py
  extended:
    if: ${{ inputs.extended }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kiwikind_ci
          POSTGRES_USER: kiwikind_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kiwikind_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-test-only-key-never-deploy-012345678901234567890123456789
      DEBUG: '1'
      DATABASE_URL: postgresql://kiwikind_ci:synthetic-ci-only@localhost:5432/kiwikind_ci
      DB_SSLMODE: disable
      TEST_LABELS: ${{ inputs.test_labels }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r runtime/requirements.txt
      - name: Additional journeys and concurrent rate limits only
        run: |
          cp portal/test_extended_verification.py runtime/portal/test_extended_verification.py
          cd runtime
          python manage.py test $TEST_LABELS --settings=config.test_settings -v 2
      - name: Record additive PostgreSQL migration SQL
        if: ${{ success() && inputs.source_ref == 'feat/native-readiness-referrals' }}
        run: cd runtime && python manage.py sqlmigrate portal 0003 > ../referral-migration.sql
      - uses: actions/upload-artifact@v4
        if: ${{ success() && inputs.source_ref == 'feat/native-readiness-referrals' }}
        with:
          name: referral-migration-sql
          path: referral-migration.sql
