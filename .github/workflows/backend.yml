name: Backend security and workflow checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: kiwikind-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-only-key-never-deploy-012345678901234567890123456789
      DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --settings=config.test_settings
      - run: node --check site/dist/app.js
      - run: node --test site/tests/*.test.cjs
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: '0'
          PUBLIC_ORIGIN: https://kiwikind.example.invalid
          ALLOWED_HOSTS: kiwikind.example.invalid
      - run: docker build -t kiwikind-ci .

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run Android tests and build prelaunch debug APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -PKIWIKIND_API_ORIGIN=https://kiwikind-backend.onrender.com
      - name: Reject unsigned release builds
        working-directory: android
        shell: bash
        run: |
          if gradle --no-daemon :app:bundleRelease --dry-run > signing-guard.log 2>&1; then
            echo "::error::Unsigned release unexpectedly accepted"; exit 1
          fi
          grep -F 'Release builds require all four KIWIKIND signing environment variables' signing-guard.log
      - name: Record build signing fingerprints for OAuth configuration
        working-directory: android
        run: gradle --no-daemon :app:signingReport > app/build/outputs/apk/debug/SIGNING-REPORT.txt
      - name: Verify APK exists and record checksum
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload installable Android debug APK for private testing
        uses: actions/upload-artifact@v4
        with:
          name: KiwiKind-Android-prelaunch-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/apk/debug/SIGNING-REPORT.txt
          if-no-files-found: error
          retention-days: 7
