name: Backend security and workflow checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: kiwikind-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  wholesale-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRET_KEY: ci-test-only-key-never-deploy-012345678901234567890123456789
      DEBUG: '1'
      ADMIN_ENABLED: '1'
      OWNER_GOOGLE_ADMIN_ENABLED: '0'
      INTAKE_ENABLED: '0'
      DATABASE_PATH: test-results/visual.sqlite3
      KIWIKIND_LOCAL_SESSION_FILE: test-results/local-session.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python scripts/prepare_wholesale_visual.py
      - name: Verify phone and desktop layouts with synthetic accounts
        run: |
          python manage.py runserver 127.0.0.1:8765 --noreload > test-results/visual-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/healthz >/dev/null; then break; fi
            sleep 1
          done
          node site/tests/wholesale-visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wholesale-phone-desktop-review
          path: test-results/wholesale-visual/*.png
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-only-key-never-deploy-012345678901234567890123456789
      DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - name: Collect production static assets for admin template checks
        run: python manage.py collectstatic --noinput
      - run: python manage.py test --settings=config.test_settings
      - run: node --check site/dist/app.js
      - run: node --test site/tests/*.test.cjs
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: '0'
          PUBLIC_ORIGIN: https://kiwikind.example.invalid
          ALLOWED_HOSTS: kiwikind.example.invalid
      - run: docker build -t kiwikind-ci .

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run Android tests and build prelaunch debug APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -PKIWIKIND_API_ORIGIN=https://kiwikind-backend.onrender.com
      - name: Reject unsigned release builds
        working-directory: android
        shell: bash
        run: |
          if gradle --no-daemon :app:bundleRelease --dry-run > signing-guard.log 2>&1; then
            echo "::error::Unsigned release unexpectedly accepted"; exit 1
          fi
          grep -F 'Release builds require all four KIWIKIND signing environment variables' signing-guard.log
      - name: Record build signing fingerprints for OAuth configuration
        working-directory: android
        run: gradle --no-daemon :app:signingReport > app/build/outputs/apk/debug/SIGNING-REPORT.txt
      - name: Verify APK exists and record checksum
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload installable Android debug APK for private testing
        uses: actions/upload-artifact@v4
        with:
          name: KiwiKind-Android-prelaunch-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/app/build/outputs/apk/debug/SIGNING-REPORT.txt
          if-no-files-found: error
          retention-days: 7

  postgres-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kiwikind_ci
          POSTGRES_USER: kiwikind_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kiwikind_ci -d kiwikind_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: ci-test-only-key-never-deploy-012345678901234567890123456789
      DEBUG: '1'
      DATABASE_URL: postgresql://kiwikind_ci:synthetic-ci-only@localhost:5432/kiwikind_ci
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect production static assets for admin template checks
        run: python manage.py collectstatic --noinput
      - name: Test migrations and account isolation on disposable PostgreSQL
        run: python manage.py test --settings=config.test_settings
