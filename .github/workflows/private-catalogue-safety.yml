name: Private catalogue public safety check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - portal/catalogue*.py
      - scripts/check_public_catalogue.py
      - scripts/test_public_catalogue_check.py
      - .github/workflows/private-catalogue-safety.yml
  push:
    branches:
      - fix/private-catalogue-safe-editing
      - feature/neon-postgres-config
    paths:
      - portal/catalogue*.py
      - scripts/check_public_catalogue.py
      - scripts/test_public_catalogue_check.py
      - portal/wholesale_admin.py
      - .github/workflows/private-catalogue-safety.yml
permissions:
  contents: read
concurrency:
  group: catalogue-public-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  read-only-public-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test published, hidden and unsafe response handling
        run: python3 -m unittest discover -s scripts -p test_public_catalogue_check.py
      - name: Check public responses without credentials or mutations
        run: python3 scripts/check_public_catalogue.py

