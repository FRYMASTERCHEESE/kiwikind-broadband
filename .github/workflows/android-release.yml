name: Android signed prelaunch release
on:
  workflow_dispatch:
    inputs:
      verify_test_ads:
        description: Verify the signed V8 test banner and consent flow on an emulator
        type: boolean
        default: true
      reuse_endpoint_tests:
        description: Reuse passing Endpoint tests only when their source and test tree are unchanged from verified run 38972732788
        type: boolean
        default: false
      capture_screenshots:
        description: Capture real signed-app screenshots on an Android emulator
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 30
    env:
      KIWIKIND_STORE_PASSWORD: ${{ secrets.KIWIKIND_STORE_PASSWORD }}
      KIWIKIND_KEY_ALIAS: ${{ secrets.KIWIKIND_KEY_ALIAS }}
      KIWIKIND_KEY_PASSWORD: ${{ secrets.KIWIKIND_KEY_PASSWORD }}
    steps:
      - name: Set temporary keystore path
        shell: bash
        run: echo "KIWIKIND_KEYSTORE=$RUNNER_TEMP/kiwikind-upload.jks" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Restore protected upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KIWIKIND_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KIWIKIND_STORE_PASSWORD KIWIKIND_KEY_ALIAS KIWIKIND_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing protected signing secret: $name"; exit 1; fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KIWIKIND_KEYSTORE"
          keytool -list -keystore "$KIWIKIND_KEYSTORE" -storepass:env KIWIKIND_STORE_PASSWORD -alias "$KIWIKIND_KEY_ALIAS" > /dev/null
      - name: Verify reused Endpoint unit-test coverage is unchanged
        if: inputs.reuse_endpoint_tests
        run: git diff --exit-code 02297394b7e8a01c970897708fd4ac69f8a1763b HEAD -- android/app/src/test/java/nz/kiwikind/broadband/EndpointTest.java android/app/src/main/java/nz/kiwikind/broadband/Endpoint.java
      - name: Endpoint unit tests when not reusing verified coverage
        if: ${{ !inputs.reuse_endpoint_tests }}
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Lint and build signed APK and bundle
        working-directory: android
        run: |
          gradle --no-daemon lintRelease assembleRelease bundleRelease
          test -s app/build/outputs/mapping/release/mapping.txt
      - name: Verify signatures and record public certificate and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" > release-evidence/APK-CERTIFICATE.txt
          jarsigner -verify "$AAB" > release-evidence/BUNDLE-VERIFICATION.txt
          keytool -printcert -jarfile "$AAB" > release-evidence/BUNDLE-CERTIFICATE.txt
          sha256sum "$APK" "$AAB" > release-evidence/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > release-evidence/COMMIT.txt
      - name: Verify advertising in final signed artifact
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print android/app/build/outputs/apk/release/app-release.apk > release-evidence/MERGED-MANIFEST.xml
          python scripts/verify_ad_release.py android/app/build/outputs/apk/release/app-release.apk release-evidence/MERGED-MANIFEST.xml android/app/build/outputs/mapping/release/mapping.txt | tee release-evidence/AD-RELEASE-VERIFICATION.txt
          grep -i 'd8c8cbf422ece5a38696f8ca199b0b3d31a7a1bbd646816a8af7c17e9bf0ed64' release-evidence/APK-CERTIFICATE.txt
      - name: Prepare same-signature ad instrumentation for the signed release
        if: inputs.verify_test_ads
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/android/AdPlacementVerification.java android/app/src/androidTest/java/nz/kiwikind/broadband/
          sed -i 's/nz.kiwikind.broadband.VisualCapture/nz.kiwikind.broadband.AdPlacementVerification/' android/app/src/androidTest/AndroidManifest.xml
          cd android
          gradle --no-daemon assembleDebugAndroidTest
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$KIWIKIND_KEYSTORE" --ks-key-alias "$KIWIKIND_KEY_ALIAS" --ks-pass env:KIWIKIND_STORE_PASSWORD --key-pass env:KIWIKIND_KEY_PASSWORD --out "$RUNNER_TEMP/kiwikind-ad-tests.apk" app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Enable emulator acceleration
        if: ${{ inputs.capture_screenshots || inputs.verify_test_ads }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify filled test banner in the actual signed release
        if: inputs.verify_test_ads
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android/verify_signed_emulator.sh
      - name: Capture real signed Android app screens
        if: inputs.capture_screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p release-evidence/screenshots
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -n nz.kiwikind.broadband/.MainActivity
            sleep 85
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml release-evidence/screenshots/window.xml
            adb exec-out screencap -p > release-evidence/screenshots/01-sign-in.png
            adb shell input swipe 500 1800 500 450 500
            sleep 2
            adb exec-out screencap -p > release-evidence/screenshots/02-privacy-controls.png
            adb logcat -d -s AndroidRuntime:E > release-evidence/ANDROID-CRASHES.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KiwiKind-signed-prelaunch-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            release-evidence/
            android/app/build/reports/
            android/app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f -- "$KIWIKIND_KEYSTORE"
