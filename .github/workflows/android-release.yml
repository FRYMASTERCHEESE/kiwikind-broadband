name: Android signed prelaunch release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 30
    env:
      KIWIKIND_KEYSTORE: ${{ runner.temp }}/kiwikind-upload.jks
      KIWIKIND_STORE_PASSWORD: ${{ secrets.KIWIKIND_STORE_PASSWORD }}
      KIWIKIND_KEY_ALIAS: ${{ secrets.KIWIKIND_KEY_ALIAS }}
      KIWIKIND_KEY_PASSWORD: ${{ secrets.KIWIKIND_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Restore protected upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KIWIKIND_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KIWIKIND_STORE_PASSWORD KIWIKIND_KEY_ALIAS KIWIKIND_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing protected signing secret: $name"; exit 1; fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KIWIKIND_KEYSTORE"
          keytool -list -keystore "$KIWIKIND_KEYSTORE" -storepass:env KIWIKIND_STORE_PASSWORD -alias "$KIWIKIND_KEY_ALIAS" > /dev/null
      - name: Test, lint and build signed APK and bundle
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintRelease assembleRelease bundleRelease
      - name: Verify signatures and record public certificate and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" > release-evidence/APK-CERTIFICATE.txt
          jarsigner -verify "$AAB" > release-evidence/BUNDLE-VERIFICATION.txt
          keytool -printcert -jarfile "$AAB" > release-evidence/BUNDLE-CERTIFICATE.txt
          sha256sum "$APK" "$AAB" > release-evidence/SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > release-evidence/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KiwiKind-signed-prelaunch-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            release-evidence/
            android/app/build/reports/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f -- "$KIWIKIND_KEYSTORE"
