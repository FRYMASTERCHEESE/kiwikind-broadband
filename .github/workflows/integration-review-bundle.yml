name: Isolated integration review bundle
on:
  push:
    branches: [integration/stripe-current-stack]
    paths: [.github/workflows/integration-review-bundle.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export committed source only and public Python dependencies
        shell: bash
        run: |
          mkdir -p review-bundle/wheels
          git archive --format=tar.gz --output=review-bundle/backend-source.tar.gz HEAD
          git rev-parse HEAD > review-bundle/SOURCE-COMMIT.txt
          python -m pip download --only-binary=:all: -r requirements.txt --dest review-bundle/wheels
          python -m pip download --only-binary=:all: 'stripe==16.0.0' --dest review-bundle/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: kiwikind-integration-review-source
          path: review-bundle/
          retention-days: 1
          if-no-files-found: error
