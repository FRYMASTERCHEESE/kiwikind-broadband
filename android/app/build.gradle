plugins { id 'com.android.application' }

def signingNames = ['KIWIKIND_KEYSTORE', 'KIWIKIND_STORE_PASSWORD', 'KIWIKIND_KEY_ALIAS', 'KIWIKIND_KEY_PASSWORD']
def releaseSigningReady = signingNames.every { System.getenv(it)?.trim() }

def apiOrigin = providers.gradleProperty('KIWIKIND_API_ORIGIN').orElse('https://kiwikind-backend.onrender.com').get()
def testAds = providers.gradleProperty('KIWIKIND_TEST_ADS').orElse('false').get() == 'true'
if (apiOrigin && !(apiOrigin ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?/)) {
    throw new GradleException('KIWIKIND_API_ORIGIN must be an HTTPS origin without a path.')
}
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        if (!releaseSigningReady || !file(System.getenv('KIWIKIND_KEYSTORE')).isFile()) {
            throw new GradleException('Release builds require all four KIWIKIND signing environment variables and an existing protected keystore. See docs/ANDROID_SIGNING.md.')
        }
        if (!apiOrigin) throw new GradleException('Release builds require a connected HTTPS API origin.')
    }
}
android {
    namespace 'nz.kiwikind.broadband'
    compileSdk 36
    defaultConfig {
        applicationId 'nz.kiwikind.broadband'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.2.5-prelaunch'
        buildConfigField 'boolean', 'TEST_ADS', testAds.toString()
        buildConfigField 'String', 'API_ORIGIN', '"' + apiOrigin + '"'
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', '"956119315558-mgaqlpnfr9r0ic9n4jtb284gaa4n7i61.apps.googleusercontent.com"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(System.getenv('KIWIKIND_KEYSTORE'))
                storePassword System.getenv('KIWIKIND_STORE_PASSWORD')
                keyAlias System.getenv('KIWIKIND_KEY_ALIAS')
                keyPassword System.getenv('KIWIKIND_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
if (!testAds) android.sourceSets.debug.java.exclude '**/AdPreview.java'
dependencies {
    if (testAds) {
        debugImplementation 'com.google.android.gms:play-services-ads:25.5.0'
        debugImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    }
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    testImplementation 'junit:junit:4.13.2'
}
